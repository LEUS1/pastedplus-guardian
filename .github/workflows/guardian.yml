name: Verificador de Enlaces
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ejecutar Verificador
        run: node scripts/guardian.js
      - name: Guardar Reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_enlaces.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: actualizar reporte de enlaces"
          git push
